<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Admin Dashboard | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="admin";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Admin Dashboard</h1><p class="mt-2 text-slate-500">Manage verification, platform users and governance.</p></header><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="card p-5"><p class="text-sm text-slate-500">Users</p><p id="users" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Companies</p><p id="companies" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Colleges</p><p id="colleges" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Pending</p><p id="pending" class="mt-2 text-3xl font-black">—</p></div></div><div class="mt-6 grid gap-6 lg:grid-cols-3"><section class="card p-5"><h2 class="font-black">Verify company</h2><div class="mt-4 flex gap-2"><input id="companyId" class="input" type="number" placeholder="Company ID"><button class="btn btn-primary" onclick="verifyCompany()">Verify</button></div></section><section class="card p-5"><h2 class="font-black">Verify college</h2><div class="mt-4 flex gap-2"><input id="collegeId" class="input" type="number" placeholder="College ID"><button class="btn btn-primary" onclick="verifyCollege()">Verify</button></div></section><section class="card p-5"><h2 class="font-black">Block user</h2><div class="mt-4 flex gap-2"><input id="userId" class="input" type="number" placeholder="User ID"><button class="btn btn-danger" onclick="blockUser()">Block</button></div></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>(async()=>{try{const r=await SB.get('/admin/dashboard'),d=r.data||r;users.textContent=d.total_users??0;companies.textContent=d.total_companies??0;colleges.textContent=d.total_colleges??0;pending.textContent=d.pending_verifications??d.pending_companies??0}catch(e){SB.toast(e.message)}})();window.verifyCompany=async()=>{try{await SB.patch(`/admin/companies/${companyId.value}/verify`,{});SB.toast('Company verified')}catch(e){SB.toast(e.message)}};window.verifyCollege=async()=>{try{await SB.patch(`/admin/colleges/${collegeId.value}/verify`,{});SB.toast('College verified')}catch(e){SB.toast(e.message)}};window.blockUser=async()=>{try{await SB.patch(`/admin/users/${userId.value}/block`,{});SB.toast('User blocked')}catch(e){SB.toast(e.message)}};</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
