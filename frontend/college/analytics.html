<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/app.css">

    <title>Skill Gap Analytics | SkillBridge AI</title>
</head>

<body class="bg-slate-50 text-slate-900">

    <script>
        window.SKILLBRIDGE_ROLE = "college";
    </script>

    <div id="app-shell">

        <main class="min-h-screen lg:pl-72">

            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

                <header class="mb-7">

                    <p class="text-sm font-semibold text-indigo-600">
                        SkillBridge AI
                    </p>

                    <h1 class="mt-1 text-3xl font-bold tracking-tight">
                        Skill Gap Analytics
                    </h1>

                    <p class="mt-2 text-slate-500">
                        Compare student skill supply against industry demand.
                    </p>

                </header>

                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

                <div class="grid gap-6 lg:grid-cols-2">

                    <section class="card p-6">

                        <h2 class="text-xl font-black">
                            Student skill supply
                        </h2>

                        <canvas
                            id="supplyChart"
                            class="mt-4"
                        ></canvas>

                    </section>

                    <section class="card p-6">

                        <h2 class="text-xl font-black">
                            Industry skill demand
                        </h2>

                        <canvas
                            id="demandChart"
                            class="mt-4"
                        ></canvas>

                    </section>

                </div>

                <section class="card mt-6 p-6">

                    <h2 class="text-xl font-black">
                        Priority skill gaps
                    </h2>

                    <div
                        id="gapList"
                        class="mt-4 grid gap-3 md:grid-cols-2"
                    ></div>

                </section>

            </div>

        </main>

    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/shell.js"></script>

    <script>

        function rows(x) {
            return x.data || x || [];
        }

        function labels(a) {
            return a.map(
                x =>
                    x.skill ||
                    x.name ||
                    x.skill_name
            );
        }

        function vals(a) {
            return a.map(
                x =>
                    x.count ??
                    x.students ??
                    x.demand_count ??
                    x.value ??
                    0
            );
        }

        (async () => {

            try {

                const [s, d, g] = await Promise.all([
                    SB.get('/colleges/analytics/student-skills'),
                    SB.get('/colleges/analytics/industry-demand'),
                    SB.get('/colleges/analytics/skill-gap')
                ]);

                const sa = rows(s);
                const da = rows(d);
                const ga = rows(g);

                new Chart(
                    document.getElementById('supplyChart'),
                    {
                        type: 'bar',

                        data: {
                            labels: labels(sa),

                            datasets: [
                                {
                                    label: 'Students',
                                    data: vals(sa)
                                }
                            ]
                        }
                    }
                );

                new Chart(
                    document.getElementById('demandChart'),
                    {
                        type: 'bar',

                        data: {
                            labels: labels(da),

                            datasets: [
                                {
                                    label: 'Demand',
                                    data: vals(da)
                                }
                            ]
                        }
                    }
                );

                gapList.innerHTML =
                    ga.map(
                        x => `
                            <div class="rounded-xl border p-4">

                                <b>
                                    ${SB.esc(
                                        x.skill ||
                                        x.name ||
                                        x.skill_name
                                    )}
                                </b>

                                <p class="mt-1 text-sm text-slate-500">

                                    Gap:
                                    ${SB.esc(
                                        x.gap ??
                                        x.gap_percentage ??
                                        x.value ??
                                        '—'
                                    )}

                                    ${
                                        typeof (
                                            x.gap ??
                                            x.gap_percentage
                                        ) === 'number'
                                            ? '%'
                                            : ''
                                    }

                                </p>

                            </div>
                        `
                    ).join('') ||
                    '<p class="text-slate-500">No gap data.</p>';

            }

            catch (e) {

                gapList.innerHTML = `
                    <p class="text-rose-600">
                        ${SB.esc(e.message)}
                    </p>
                `;

            }

        })();

    </script>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>

</body>
</html>
