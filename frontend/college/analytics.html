<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="/assets/css/app.css">

    <title>Skill Gap Analytics | SkillBridge AI</title>
</head>

<body class="bg-slate-50 text-slate-900">

<script>
    window.SKILLBRIDGE_ROLE = "college";
</script>

<div id="app-shell">

    <main class="min-h-screen lg:pl-72">

        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

            <header class="mb-7">

                <p class="text-sm font-semibold text-indigo-600">
                    SkillBridge AI
                </p>

                <h1 class="mt-1 text-3xl font-bold tracking-tight">
                    Skill Gap Analytics
                </h1>

                <p class="mt-2 text-slate-500">
                    Compare student skill supply against industry demand.
                </p>

            </header>

            <div
                id="pageMessage"
                class="mb-5 hidden rounded-xl border p-4 text-sm"
            ></div>

            <div class="grid gap-6 lg:grid-cols-2">

                <section class="card p-6">

                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-xl font-black">
                            Student skill supply
                        </h2>

                        <span
                            id="supplyCount"
                            class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold text-indigo-700"
                        >
                            0 skills
                        </span>
                    </div>

                    <div
                        id="supplyEmpty"
                        class="mt-8 hidden rounded-xl border border-dashed border-slate-200 p-8 text-center text-sm text-slate-500"
                    >
                        No student skill data is available for this college yet.
                    </div>

                    <canvas
                        id="supplyChart"
                        class="mt-4"
                    ></canvas>

                </section>

                <section class="card p-6">

                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-xl font-black">
                            Industry skill demand
                        </h2>

                        <span
                            id="demandCount"
                            class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold text-indigo-700"
                        >
                            0 skills
                        </span>
                    </div>

                    <div
                        id="demandEmpty"
                        class="mt-8 hidden rounded-xl border border-dashed border-slate-200 p-8 text-center text-sm text-slate-500"
                    >
                        No industry demand data is available yet.
                    </div>

                    <canvas
                        id="demandChart"
                        class="mt-4"
                    ></canvas>

                </section>

            </div>

            <section class="card mt-6 p-6">

                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-xl font-black">
                        Priority skill gaps
                    </h2>

                    <button
                        id="refreshBtn"
                        type="button"
                        class="btn btn-soft"
                    >
                        <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                        Refresh
                    </button>
                </div>

                <div
                    id="gapList"
                    class="mt-4 grid gap-3 md:grid-cols-2"
                ></div>

            </section>

        </div>

    </main>

</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/shell.js"></script>

<script>
    const supplyCanvas =
        document.getElementById("supplyChart");

    const demandCanvas =
        document.getElementById("demandChart");

    const supplyEmpty =
        document.getElementById("supplyEmpty");

    const demandEmpty =
        document.getElementById("demandEmpty");

    const supplyCount =
        document.getElementById("supplyCount");

    const demandCount =
        document.getElementById("demandCount");

    const gapList =
        document.getElementById("gapList");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const pageMessage =
        document.getElementById("pageMessage");

    let supplyChartInstance = null;
    let demandChartInstance = null;


    function showPageMessage(type, text) {
        pageMessage.classList.remove("hidden");

        if (type === "error") {
            pageMessage.className =
                "mb-5 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700";
        } else {
            pageMessage.className =
                "mb-5 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700";
        }

        pageMessage.textContent = text;
    }


    function hidePageMessage() {
        pageMessage.classList.add("hidden");
    }


    /*
        Backend responses can be:
        [ ... ]

        OR

        {
            success: true,
            data: [ ... ]
        }

        OR

        {
            success: true,
            data: {
                skills: [ ... ]
            }
        }

        OR endpoints may use names like:
        student_skills, industry_demand, gaps.
    */
    function rows(response, preferredKeys = []) {

        if (Array.isArray(response)) {
            return response;
        }

        if (Array.isArray(response?.data)) {
            return response.data;
        }

        for (const key of preferredKeys) {

            if (Array.isArray(response?.[key])) {
                return response[key];
            }

            if (Array.isArray(response?.data?.[key])) {
                return response.data[key];
            }
        }

        return [];
    }


    function skillName(item) {
        return (
            item?.skill_name ??
            item?.skill ??
            item?.name ??
            item?.skill?.name ??
            "Unknown"
        );
    }


    function supplyValue(item) {
        return Number(
            item?.student_count ??
            item?.students_count ??
            item?.students ??
            item?.count ??
            item?.supply ??
            item?.student_supply ??
            item?.value ??
            0
        ) || 0;
    }


    function demandValue(item) {
        return Number(
            item?.demand_count ??
            item?.required_count ??
            item?.opportunity_count ??
            item?.opportunities ??
            item?.demand ??
            item?.industry_demand ??
            item?.count ??
            item?.value ??
            0
        ) || 0;
    }


    function gapValue(item) {
        return Number(
            item?.gap ??
            item?.gap_count ??
            item?.shortage ??
            item?.difference ??
            item?.gap_percentage ??
            item?.value ??
            0
        ) || 0;
    }


    function destroyCharts() {

        if (supplyChartInstance) {
            supplyChartInstance.destroy();
            supplyChartInstance = null;
        }

        if (demandChartInstance) {
            demandChartInstance.destroy();
            demandChartInstance = null;
        }
    }


    function createSupplyChart(items) {

        const chartRows =
            items.filter(
                item => skillName(item) !== "Unknown"
            );

        supplyCount.textContent =
            `${chartRows.length} skill${chartRows.length === 1 ? "" : "s"}`;

        if (!chartRows.length) {
            supplyCanvas.classList.add("hidden");
            supplyEmpty.classList.remove("hidden");
            return;
        }

        supplyEmpty.classList.add("hidden");
        supplyCanvas.classList.remove("hidden");

        supplyChartInstance =
            new Chart(
                supplyCanvas,
                {
                    type: "bar",

                    data: {
                        labels:
                            chartRows.map(skillName),

                        datasets: [
                            {
                                label: "Students",
                                data:
                                    chartRows.map(supplyValue)
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: true,

                        scales: {
                            y: {
                                beginAtZero: true,

                                ticks: {
                                    precision: 0
                                }
                            }
                        },

                        plugins: {
                            legend: {
                                display: true
                            },

                            tooltip: {
                                callbacks: {
                                    label(context) {
                                        return `Students: ${context.raw}`;
                                    }
                                }
                            }
                        }
                    }
                }
            );
    }


    function createDemandChart(items) {

        const chartRows =
            items.filter(
                item => skillName(item) !== "Unknown"
            );

        demandCount.textContent =
            `${chartRows.length} skill${chartRows.length === 1 ? "" : "s"}`;

        if (!chartRows.length) {
            demandCanvas.classList.add("hidden");
            demandEmpty.classList.remove("hidden");
            return;
        }

        demandEmpty.classList.add("hidden");
        demandCanvas.classList.remove("hidden");

        demandChartInstance =
            new Chart(
                demandCanvas,
                {
                    type: "bar",

                    data: {
                        labels:
                            chartRows.map(skillName),

                        datasets: [
                            {
                                label: "Demand",
                                data:
                                    chartRows.map(demandValue)
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: true,

                        scales: {
                            y: {
                                beginAtZero: true,

                                ticks: {
                                    precision: 0
                                }
                            }
                        },

                        plugins: {
                            legend: {
                                display: true
                            },

                            tooltip: {
                                callbacks: {
                                    label(context) {
                                        return `Demand: ${context.raw}`;
                                    }
                                }
                            }
                        }
                    }
                }
            );
    }


    function renderGapList(items) {

        if (!items.length) {
            gapList.innerHTML = `
                <p class="text-slate-500">
                    No gap data is available yet.
                </p>
            `;

            return;
        }

        const sorted =
            [...items].sort(
                (a, b) =>
                    gapValue(b) -
                    gapValue(a)
            );

        gapList.innerHTML =
            sorted.map(
                item => {

                    const name =
                        skillName(item);

                    const supply =
                        supplyValue(item);

                    const demand =
                        demandValue(item);

                    const gap =
                        gapValue(item);

                    const gapPercentage =
                        item?.gap_percentage;

                    return `
                        <div class="rounded-xl border border-slate-200 bg-white p-4">

                            <div class="flex items-start justify-between gap-3">

                                <div>
                                    <b class="text-slate-900">
                                        ${SB.esc(name)}
                                    </b>

                                    <p class="mt-1 text-xs text-slate-500">
                                        Students: ${SB.esc(supply)}
                                        &nbsp;•&nbsp;
                                        Demand: ${SB.esc(demand)}
                                    </p>
                                </div>

                                <span class="rounded-full bg-rose-50 px-2.5 py-1 text-xs font-black text-rose-700">
                                    Gap ${SB.esc(
                                        typeof gapPercentage === "number"
                                            ? `${gapPercentage}%`
                                            : gap
                                    )}
                                </span>

                            </div>

                        </div>
                    `;
                }
            ).join("");
    }


    async function loadAnalytics() {

        hidePageMessage();

        refreshBtn.disabled = true;

        refreshBtn.innerHTML = `
            <span class="spinner"></span>
            Loading...
        `;

        gapList.innerHTML = `
            <p class="text-slate-500">
                Loading analytics...
            </p>
        `;

        destroyCharts();

        try {

            const [studentResponse, demandResponse, gapResponse] =
                await Promise.all([
                    SB.get(
                        "/colleges/analytics/student-skills"
                    ),

                    SB.get(
                        "/colleges/analytics/industry-demand"
                    ),

                    SB.get(
                        "/colleges/analytics/skill-gap"
                    )
                ]);


            /*
                IMPORTANT:
                Keep these console logs during testing.
                They show the exact backend JSON.
            */
            console.log(
                "STUDENT SKILLS API:",
                studentResponse
            );

            console.log(
                "INDUSTRY DEMAND API:",
                demandResponse
            );

            console.log(
                "SKILL GAP API:",
                gapResponse
            );


            const studentRows =
                rows(
                    studentResponse,
                    [
                        "skills",
                        "student_skills",
                        "student_skill_supply"
                    ]
                );


            const demandRows =
                rows(
                    demandResponse,
                    [
                        "skills",
                        "industry_demand",
                        "demand"
                    ]
                );


            const gapRows =
                rows(
                    gapResponse,
                    [
                        "gaps",
                        "skill_gaps",
                        "skill_gap"
                    ]
                );


            console.log(
                "NORMALIZED STUDENT ROWS:",
                studentRows
            );

            console.log(
                "NORMALIZED DEMAND ROWS:",
                demandRows
            );

            console.log(
                "NORMALIZED GAP ROWS:",
                gapRows
            );


            createSupplyChart(
                studentRows
            );

            createDemandChart(
                demandRows
            );

            renderGapList(
                gapRows
            );


            /*
                This is useful because a 200 API can still
                return an empty array if DB has no linked records.
            */
            if (
                !studentRows.length &&
                !demandRows.length &&
                !gapRows.length
            ) {
                showPageMessage(
                    "error",
                    "Analytics APIs are connected, but the backend returned no analytics records. Check college-student linking and opportunity required-skill data."
                );
            }

        }

        catch (error) {

            console.error(
                "Skill Gap Analytics error:",
                error
            );

            showPageMessage(
                "error",
                error?.message ||
                "Could not load analytics data."
            );

            gapList.innerHTML = `
                <p class="text-rose-600">
                    ${SB.esc(
                        error?.message ||
                        "Could not load analytics."
                    )}
                </p>
            `;

        }

        finally {

            refreshBtn.disabled = false;

            refreshBtn.innerHTML = `
                <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                Refresh
            `;

            if (window.lucide) {
                lucide.createIcons();
            }
        }
    }


    refreshBtn.addEventListener(
        "click",
        loadAnalytics
    );


    loadAnalytics();


    if (window.lucide) {
        lucide.createIcons();
    }
</script>

</body>
</html>
