<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Collaboration Requests | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="college";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Collaboration Requests</h1><p class="mt-2 text-slate-500">Review and manage proposals from industry partners.</p></header><div id="list" class="space-y-4"></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function load(){try{const r=await SB.get('/colleges/collaborations');list.innerHTML=(r.data||[]).map(c=>`<article class="card p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><span class="badge">${SB.esc(c.collaboration_type)}</span><h2 class="mt-2 text-lg font-black">${SB.esc(c.title)}</h2><p class="mt-1 text-sm text-slate-500">${SB.esc(c.description||'')}</p></div><span class="badge">${SB.esc(c.status)}</span></div><div class="mt-4 flex gap-2"><button class="btn btn-primary" onclick="setStatus(${c.id},'approved')">Approve</button><button class="btn btn-danger" onclick="setStatus(${c.id},'rejected')">Reject</button><button class="btn btn-soft" onclick="setStatus(${c.id},'completed')">Complete</button></div></article>`).join('')||'<p class="text-slate-500">No collaboration requests.</p>'}catch(e){list.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}window.setStatus=async(id,status)=>{try{await SB.patch(`/colleges/collaborations/${id}/status`,{status,college_note:null});load()}catch(e){SB.toast(e.message)}};load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
