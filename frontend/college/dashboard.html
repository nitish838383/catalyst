<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>College / TPO Dashboard | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="college";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">College / TPO Dashboard</h1><p class="mt-2 text-slate-500">See student skill supply, industry demand and collaboration activity.</p></header><div id="onboarding" class="hidden mb-5 rounded-xl border border-amber-200 bg-amber-50 p-4 text-amber-800">Create your college profile first. <a href="profile.html" class="font-bold underline">Open College Profile</a></div><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="card p-5"><p class="text-sm text-slate-500">Students</p><p id="students" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Departments</p><p id="departments" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Skill Gaps</p><p id="gaps" class="mt-2 text-3xl font-black">—</p></div><div class="card p-5"><p class="text-sm text-slate-500">Collaborations</p><p id="collabs" class="mt-2 text-3xl font-black">—</p></div></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>(async()=>{try{const r=await SB.get('/colleges/dashboard/summary')
