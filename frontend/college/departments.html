<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Departments | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="college";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Departments</h1><p class="mt-2 text-slate-500">Organize students and analytics by academic department.</p></header><div class="grid gap-6 lg:grid-cols-2"><section class="card p-6"><h2 class="text-xl font-black">Add department</h2><form id="form" class="mt-4 space-y-3"><input class="input" name="name" placeholder="Department name" required><input class="input" name="code" placeholder="Code"><button class="btn btn-primary">Add department</button></form></section><section class="card p-6"><h2 class="text-xl font-black">Departments</h2><div id="list" class="mt-4 space-y-2"></div></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function load(){try{const r=await SB.get('/colleges/departments');list.innerHTML=(r.data||[]).map(d=>`<div class="rounded-xl border p-3"><b>${SB.esc(d.name)}</b><span class="ml-2 text-sm text-slate-500">${SB.esc(d.code||'')}</span></div>`).join('')||'<p class="text-slate-500">No departments.</p>'}catch(e){list.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}form.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await SB.post('/colleges/departments',{name:f.get('name'),code:f.get('code')||null});e.target.reset();load()}catch(err){SB.toast(err.message)}};load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
