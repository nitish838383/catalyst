<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/app.css">

    <title>College Profile | SkillBridge AI</title>
</head>

<body class="bg-slate-50 text-slate-900">

    <script>
        window.SKILLBRIDGE_ROLE = "college";
    </script>

    <div id="app-shell">

        <main class="min-h-screen lg:pl-72">

            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

                <header class="mb-7">

                    <p class="text-sm font-semibold text-indigo-600">
                        SkillBridge AI
                    </p>

                    <h1 class="mt-1 text-3xl font-bold tracking-tight">
                        College Profile
                    </h1>

                    <p class="mt-2 text-slate-500">
                        Complete TPO/college onboarding before using analytics.
                    </p>

                </header>


                <section class="card max-w-3xl p-6">

                    <h2 class="text-xl font-black">
                        College profile
                    </h2>


                    <form
                        id="form"
                        class="mt-5 grid gap-4 sm:grid-cols-2"
                    >

                        <input
                            class="input"
                            name="name"
                            placeholder="College name"
                            required
                        >

                        <input
                            class="input"
                            name="university"
                            placeholder="Affiliated university"
                        >

                        <input
                            class="input"
                            name="city"
                            placeholder="City"
                        >

                        <input
                            class="input"
                            name="state"
                            placeholder="State"
                        >

                        <input
                            class="input sm:col-span-2"
                            name="website"
                            placeholder="Website"
                        >

                        <button
                            class="btn btn-primary sm:col-span-2"
                        >
                            Create profile
                        </button>

                        <p
                            id="msg"
                            class="sm:col-span-2 text-sm"
                        ></p>

                    </form>

                </section>

            </div>

        </main>

    </div>


    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/shell.js"></script>


    <script>

        form.onsubmit = async e => {

            e.preventDefault();

            const f =
                new FormData(
                    e.target
                );

            const b = {};


            for (const [k, v] of f) {

                if (v !== '') {
                    b[k] = v;
                }

            }


            try {

                await SB.post(
                    '/colleges/profile',
                    b
                );

                msg.className =
                    'sm:col-span-2 text-sm text-emerald-600';

                msg.textContent =
                    'College profile created.';

            }

            catch (err) {

                msg.className =
                    'sm:col-span-2 text-sm text-rose-600';

                msg.textContent =
                    err.message;

            }

        };

    </script>


    <script>

        if (window.lucide) {
            lucide.createIcons();
        }

    </script>

</body>
</html>
