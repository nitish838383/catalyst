<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Login | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><div class="grid min-h-screen place-items-center bg-slate-950 px-4"><div class="card w-full max-w-md p-7"><a href="/" class="text-xl font-black text-indigo-600">SkillBridge AI</a><h1 class="mt-6 text-3xl font-black">Welcome back</h1><p class="mt-2 text-slate-500">Login to your role-based dashboard.</p><form id="loginForm" class="mt-6 space-y-4"><div><label class="label">Email</label><input class="input" name="email" type="email" required></div><div><label class="label">Password</label><input class="input" name="password" type="password" required></div><button class="btn btn-primary w-full">Login</button><p id="msg" class="text-sm text-rose-600"></p></form><p class="mt-5 text-sm text-slate-500">New here? <a class="font-bold text-indigo-600" href="/register.html">Create account</a></p></div></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),m=document.getElementById('msg');m.textContent='';try{const r=await SB.post('/auth/login',{email:f.get('email'),password:f.get('password')});Auth.save(r.access_token);const me=await Auth.me(true);location.href=Auth.home(me.role)}catch(err){m.textContent=err.message}}</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
