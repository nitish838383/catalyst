<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login — SkillBridge AI">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <title>Login | SkillBridge AI</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .input-focus:focus {
      border-color: #818cf8 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">

  <div class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 overflow-hidden">

    <!-- Ambient Glow -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute -left-32 top-20 h-[420px] w-[420px] rounded-full bg-indigo-600/20 blur-[120px]"></div>
      <div class="absolute -right-24 bottom-10 h-[360px] w-[360px] rounded-full bg-violet-600/15 blur-[100px]"></div>
    </div>

    <!-- Navbar -->
    <nav class="relative z-10 mx-auto flex max-w-7xl items-center justify-between px-6 py-6">
      <a href="/" class="flex items-center gap-2 text-xl font-black text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500/20">
          <i data-lucide="sparkles" class="h-4 w-4 text-indigo-300"></i>
        </span>
        SkillBridge AI
      </a>
      <a href="/register.html" class="btn border border-white/15 bg-white/5 text-white hover:bg-white/10 transition">
        Create Account
      </a>
    </nav>

    <!-- Center Card -->
    <div class="relative z-10 flex min-h-[calc(100vh-88px)] items-center justify-center px-4 pb-16">
      <div class="w-full max-w-md">

        <!-- Header -->
        <div class="mb-9 text-center">
          <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-500/20 ring-1 ring-indigo-400/30 shadow-lg shadow-indigo-500/10">
            <i data-lucide="shield-check" class="h-8 w-8 text-indigo-300"></i>
          </div>
          <h1 class="text-3xl font-black tracking-tight text-white sm:text-4xl">Welcome back</h1>
          <p class="mt-2.5 text-slate-400">Login to your role-based dashboard</p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-3xl border border-white/10 p-8 shadow-2xl sm:p-9">

          <form id="loginForm" class="space-y-5">

            <!-- Email -->
            <div>
              <label class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                  <i data-lucide="mail" class="h-4 w-4 text-slate-500"></i>
                </div>
                <input
                  class="input input-focus w-full rounded-xl border border-white/15 bg-white/5 py-3.5 pl-11 pr-4 text-sm text-white placeholder-slate-500 outline-none transition"
                  name="email"
                  type="email"
                  placeholder="you@college.edu"
                  required
                  autocomplete="email"
                >
              </div>
            </div>

            <!-- Password -->
            <div>
              <div class="mb-1.5 flex items-center justify-between">
                <label class="block text-sm font-medium text-slate-300">Password</label>
                <a href="/forgot-password.html" class="text-xs font-medium text-indigo-400 transition hover:text-indigo-300">
                  Forgot password?
                </a>
              </div>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                  <i data-lucide="lock" class="h-4 w-4 text-slate-500"></i>
                </div>
                <input
                  id="password"
                  class="input input-focus w-full rounded-xl border border-white/15 bg-white/5 py-3.5 pl-11 pr-12 text-sm text-white placeholder-slate-500 outline-none transition"
                  name="password"
                  type="password"
                  placeholder="••••••••"
                  required
                  autocomplete="current-password"
                >
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 transition hover:text-slate-300"
                  aria-label="Toggle password visibility"
                >
                  <i data-lucide="eye" class="h-4 w-4" id="eyeIcon"></i>
                </button>
              </div>
            </div>

            <!-- Submit -->
            <button
              type="submit"
              id="submitBtn"
              class="btn btn-primary mt-2 flex w-full items-center justify-center gap-2 py-3.5 text-base shadow-lg shadow-indigo-500/25"
            >
              <span id="btnContent">
                <span id="btnText">Login</span>
              </span>
            </button>

            <!-- Error -->
            <p id="msg" class="min-h-[20px] text-center text-sm text-rose-400"></p>
          </form>

          <div class="mt-7 border-t border-white/10 pt-6 text-center">
            <p class="text-sm text-slate-400">
              New here?
              <a class="font-semibold text-indigo-400 transition hover:text-indigo-300" href="/register.html">
                Create account
              </a>
            </p>
          </div>
        </div>

        <!-- Trust line -->
        <p class="mt-8 text-center text-xs text-slate-500">
          Secure role-based access for Students, Colleges & Industry
        </p>

      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>

  <script>
    if (window.lucide) lucide.createIcons();

    // Password show/hide
    document.getElementById('togglePassword')?.addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    // Login form
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();

      const f = new FormData(e.target);
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      const btnContent = document.getElementById('btnContent');

      msg.textContent = '';
      btn.disabled = true;

      btnContent.innerHTML = `
        <div class="spinner"></div>
        <span>Signing in...</span>
      `;

      try {
        const r = await SB.post('/auth/login', {
          email: f.get('email'),
          password: f.get('password')
        });

        Auth.save(r.access_token);
        const me = await Auth.me(true);
        location.href = Auth.home(me.role);

      } catch (err) {
        msg.textContent = err.message || 'Login failed';
        btn.disabled = false;
        btnContent.innerHTML = `<span id="btnText">Login</span>`;
      }
    };
  </script>
</body>
</html>
