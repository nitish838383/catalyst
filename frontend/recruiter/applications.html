<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Ranked Applicants | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="recruiter";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Ranked Applicants</h1><p class="mt-2 text-slate-500">Review candidates by explainable match score and update status.</p></header><div class="card p-5"><div class="flex gap-3"><input id="oid" class="input" type="number" placeholder="Opportunity ID"><button id="loadBtn" class="btn btn-primary">Load applicants</button></div></div><div id="list" class="mt-5 space-y-4"></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>loadBtn.onclick=load;async function load(){if(!oid.value)return;try{const r=await SB.get(`/recruiters/opportunities/${oid.value}/applications`);list.innerHTML=(r.candidates||[]).map(c=>`<article class="card p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><h2 class="text-lg font-black">${SB.esc(c.name)}</h2><p class="text-sm text-slate-500">${SB.esc(c.email)}</p></div><div class="text-2xl font-black text-indigo-600">${c.match_score}%</div></div><p class="mt-3 text-sm"><b>Matched:</b> ${(c.matched_skills||[]).map(SB.esc).join(', ')||'—'}</p><p class="mt-1 text-sm"><b>Missing:</b> ${(c.missing_skills||[]).map(SB.esc).join(', ')||'—'}</p><div class="mt-4 flex flex-wrap gap-2"><select id="status-${c.application_id}" class="input max-w-xs"><option>under_review</option><option>shortlisted</option><option>interview</option><option>selected</option><option>rejected</option></select><button class="btn btn-primary" onclick="setStatus(${c.application_id})">Update</button><button class="btn btn-soft" onclick="schedule(${c.application_id})">Schedule interview</button></div></article>`).join('')||'<p class="text-slate-500">No applicants.</p>'}catch(e){list.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}window.setStatus=async id=>{try{await SB.patch(`/recruiters/applications/${id}/status`,{status:document.getElementById('status-'+id).value,recruiter_note:null});SB.toast('Status updated')}catch(e){SB.toast(e.message)}};window.schedule=async id=>{const scheduled_at=prompt('Interview date/time (YYYY-MM-DDTHH:MM:SS):');if(!scheduled_at)return;const mode=prompt('Mode (online/offline):','online')||'online';const meeting_link=mode==='online'?prompt('Meeting link:',''):null;try{await SB.post(`/recruiters/applications/${id}/interview`,{scheduled_at,mode,meeting_link,location:null,instructions:null});SB.toast('Interview scheduled')}catch(e){SB.toast(e.message)}};</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
