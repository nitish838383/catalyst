<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Industry Collaboration | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="recruiter";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Industry Collaboration</h1><p class="mt-2 text-slate-500">Propose workshops, mentorship, hackathons and placement initiatives.</p></header><section class="card p-6"><h2 class="text-xl font-black">Propose collaboration</h2><form id="form" class="mt-5 grid gap-4 sm:grid-cols-2"><input class="input" type="number" name="college_id" placeholder="College ID" required><select class="input" name="collaboration_type"><option value="workshop">Workshop</option><option value="guest_lecture">Guest Lecture</option><option value="hackathon">Hackathon</option><option value="mentorship">Mentorship</option><option value="industry_project">Industry Project</option><option value="internship_drive">Internship Drive</option><option value="placement_drive">Placement Drive</option></select><input class="input sm:col-span-2" name="title" placeholder="Title" required><textarea class="input sm:col-span-2" name="description" placeholder="Description"></textarea><input class="input" name="proposed_date" type="datetime-local"><input class="input" name="location" placeholder="Location"><select class="input" name="mode"><option value="online">Online</option><option value="offline">Offline</option><option value="hybrid">Hybrid</option></select><input class="input" name="skills" placeholder="Skills, comma separated"><button class="btn btn-primary sm:col-span-2">Send proposal</button><p id="msg" class="sm:col-span-2 text-sm"></p></form></section></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b={college_id:Number(f.get('college_id')),collaboration_type:f.get('collaboration_type'),title:f.get('title'),description:f.get('description')||null,proposed_date:f.get('proposed_date')||null,location:f.get('location')||null,mode:f.get('mode'),skills:String(f.get('skills')||'').split(',').map(x=>x.trim()).filter(Boolean)};try{const r=await SB.post('/recruiters/collaborations',b);msg.className='sm:col-span-2 text-sm text-emerald-600';msg.textContent=`Proposal #${r.id} sent.`;e.target.reset()}catch(err){msg.className='sm:col-span-2 text-sm text-rose-600';msg.textContent=err.message}};</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
