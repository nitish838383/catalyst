<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Register | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><div class="grid min-h-screen place-items-center bg-slate-950 px-4 py-10"><div class="card w-full max-w-lg p-7"><a href="/" class="text-xl font-black text-indigo-600">SkillBridge AI</a><h1 class="mt-6 text-3xl font-black">Create your account</h1><form id="registerForm" class="mt-6 grid gap-4"><div><label class="label">Full name</label><input class="input" name="full_name" required></div><div><label class="label">Email</label><input class="input" type="email" name="email" required></div><div><label class="label">Password</label><input class="input" type="password" name="password" minlength="8" required></div><div><label class="label">Role</label><select class="input" name="role"><option value="student">Student</option><option value="recruiter">Recruiter / Industry</option><option value="college">College / TPO</option></select></div><button class="btn btn-primary">Register</button><p id="msg" class="text-sm text-rose-600"></p></form><p class="mt-5 text-sm text-slate-500">Already registered? <a class="font-bold text-indigo-600" href="/login.html">Login</a></p></div></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),m=document.getElementById('msg');try{const r=await SB.post('/auth/register',{full_name:f.get('full_name'),email:f.get('email'),password:f.get('password'),role:f.get('role')});Auth.save(r.access_token);const me=await Auth.me(true);location.href=Auth.home(me.role)}catch(err){m.textContent=err.message}}</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
