<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>My Applications | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">My Applications</h1><p class="mt-2 text-slate-500">Track application status and withdraw active applications.</p></header><div class="card p-6"><div class="table-wrap"><table class="w-full text-left text-sm"><thead><tr class="border-b text-slate-500"><th class="py-3">Opportunity</th><th>Status</th><th>Applied</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function load(){try{const r=await SB.get('/students/applications');rows.innerHTML=(r.data||[]).map(a=>`<tr class="border-b last:border-0"><td class="py-4 font-bold">${SB.esc(a.title)}</td><td><span class="badge">${SB.esc(a.status)}</span></td><td>${SB.fmtDate(a.applied_at)}</td><td>${['selected','rejected','withdrawn'].includes(a.status)?'—':`<button class="btn btn-danger" onclick="withdraw(${a.application_id})">Withdraw</button>`}</td></tr>`).join('')||'<tr><td class="py-6 text-slate-500" colspan="4">No applications yet.</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="4" class="py-4 text-rose-600">${SB.esc(e.message)}</td></tr>`}}window.withdraw=async id=>{try{await SB.patch(`/students/applications/${id}/withdraw`,{});load()}catch(e){SB.toast(e.message)}};load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
