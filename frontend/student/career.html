<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Career Readiness | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Career Readiness</h1><p class="mt-2 text-slate-500">Measure role readiness and generate a personalized learning roadmap.</p></header><div class="grid gap-6 lg:grid-cols-2"><section class="card p-6"><h2 class="text-xl font-black">Career readiness</h2><label class="label mt-5">Target role</label><select id="role" class="input"><option value="backend developer">Backend Developer</option><option value="frontend developer">Frontend Developer</option><option value="full stack developer">Full Stack Developer</option><option value="ai ml engineer">AI/ML Engineer</option></select><button id="checkBtn" class="btn btn-primary mt-4">Check readiness</button><div id="readiness" class="mt-6"></div></section><section class="card p-6"><h2 class="text-xl font-black">Personalized roadmap</h2><button id="roadmapBtn" class="btn btn-soft mt-5">Generate roadmap</button><div id="roadmap" class="mt-5 space-y-3"></div></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>checkBtn.onclick=async()=>{try{const r=await SB.get('/career/readiness?role='+encodeURIComponent(role.value)),d=r.data||r;readiness.innerHTML=`<div class="text-5xl font-black text-indigo-600">${d.readiness_score??d.score??0}%</div><p class="mt-3 text-sm"><b>Matched:</b> ${(d.matched_skills||[]).map(SB.esc).join(', ')||'—'}</p><p class="mt-2 text-sm"><b>Missing:</b> ${(d.missing_skills||[]).map(SB.esc).join(', ')||'—'}</p>`}catch(e){readiness.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}};roadmapBtn.onclick=async()=>{try{const r=await SB.request('/career/roadmap?role='+encodeURIComponent(role.value),{method:'POST'}),d=r.data||r,steps=d.roadmap||d.steps||d.roadmap_steps||[];roadmap.innerHTML=steps.map((s,i)=>`<div class="rounded-xl border p-4"><span class="badge">Step ${i+1}</span><h3 class="mt-2 font-bold">${SB.esc(s.title||s.skill||s.name||'Learning step')}</h3><p class="mt-1 text-sm text-slate-500">${SB.esc(s.description||s.action||'')}</p></div>`).join('')||'<p class="text-slate-500">Roadmap generated.</p>'}catch(e){roadmap.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}};</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
