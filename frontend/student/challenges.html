<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Industry Challenges | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Industry Challenges</h1><p class="mt-2 text-slate-500">Solve real industry problems and showcase your capability.</p></header><div id="list" class="grid gap-4 lg:grid-cols-2"></div><div id="modal" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/60 p-4"><form id="submitForm" class="card w-full max-w-lg p-6"><input type="hidden" name="cid"><h2 class="text-xl font-black">Submit solution</h2><input class="input mt-4" name="title" placeholder="Submission title" required><textarea class="input mt-3" name="description" rows="6" placeholder="Describe your solution" required></textarea><input class="input mt-3" name="github_url" placeholder="GitHub URL"><div class="mt-4 flex gap-2"><button class="btn btn-primary">Submit</button><button type="button" class="btn btn-soft" onclick="modal.classList.add('hidden');modal.classList.remove('grid')">Cancel</button></div></form></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function load(){try{const r=await SB.get('/challenges'),a=r.data||r||[];list.innerHTML=a.map(c=>`<article class="card p-5"><span class="badge">Industry Challenge</span><h2 class="mt-3 text-xl font-black">${SB.esc(c.title)}</h2><p class="mt-2 text-sm text-slate-500">${SB.esc(c.problem_statement||'')}</p><button class="btn btn-primary mt-4" onclick="openSubmit(${c.id})">Submit solution</button></article>`).join('')||'<p class="text-slate-500">No open challenges.</p>'}catch(e){list.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}window.openSubmit=id=>{submitForm.cid.value=id;modal.classList.remove('hidden');modal.classList.add('grid')};submitForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await SB.post(`/challenges/${f.get('cid')}/submit`,{title:f.get('title'),description:f.get('description'),github_url:f.get('github_url')||null,demo_url:null});modal.classList.add('hidden');modal.classList.remove('grid');SB.toast('Solution submitted')}catch(err){SB.toast(err.message)}};load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
