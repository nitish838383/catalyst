<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>AI Career Assistant | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">AI Career Assistant</h1><p class="mt-2 text-slate-500">Ask personalized questions using your SkillBridge profile context.</p></header><div class="card flex min-h-[65vh] flex-col overflow-hidden"><div id="messages" class="flex-1 space-y-3 overflow-y-auto p-5"></div><form id="chatForm" class="flex gap-3 border-t p-4"><input class="input" name="message" placeholder="Ask about your career, skills or roadmap…" required><button class="btn btn-primary">Send</button></form></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>let sid=null;function bubble(m){const user=(m.role||m.sender)==='user';return `<div class="flex ${user?'justify-end':'justify-start'}"><div class="max-w-[80%] rounded-2xl px-4 py-3 ${user?'bg-indigo-600 text-white':'bg-slate-100'}">${SB.esc(m.content||m.message||'')}</div></div>`}async function init(){try{const s=await SB.get('/career-chat/sessions');const arr=s.data||s||[];sid=arr[0]?.id;if(!sid){const n=await SB.post('/career-chat/sessions',{title:'Career Assistant'});sid=n.data?.session_id||n.session_id||n.id}const m=await SB.get(`/career-chat/sessions/${sid}/messages`);messages.innerHTML=(m.data||m||[]).map(bubble).join('')||'<p class="text-center text-sm text-slate-500">Ask your first career question.</p>'}catch(e){messages.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}chatForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),txt=f.get('message');messages.innerHTML+=bubble({role:'user',content:txt});e.target.reset();try{const r=await SB.post(`/career-chat/sessions/${sid}/messages`,{message:txt});messages.innerHTML+=bubble({role:'assistant',content:r.data?.answer||r.answer||r.message||r.content||'Response received.'});messages.scrollTop=messages.scrollHeight}catch(err){SB.toast(err.message)}};init();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
