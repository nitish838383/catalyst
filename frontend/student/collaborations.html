<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/app.css">

    <title>Collaborations | SkillBridge AI</title>
</head>

<body class="bg-slate-50 text-slate-900">

    <script>
        window.SKILLBRIDGE_ROLE = "student";
    </script>

    <div id="app-shell">

        <main class="min-h-screen lg:pl-72">

            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

                <header class="mb-7">

                    <p class="text-sm font-semibold text-indigo-600">
                        SkillBridge AI
                    </p>

                    <h1 class="mt-1 text-3xl font-bold tracking-tight">
                        Collaborations
                    </h1>

                    <p class="mt-2 text-slate-500">
                        Join approved workshops, hackathons, mentorships and industry programs.
                    </p>

                </header>


                <div
                    id="list"
                    class="grid gap-4 lg:grid-cols-2"
                ></div>

            </div>

        </main>

    </div>


    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/shell.js"></script>


    <script>

        (async () => {

            try {

                const r =
                    await SB.get(
                        '/collaborations'
                    );


                const a =
                    r.data ||
                    r ||
                    [];


                list.innerHTML =
                    a
                        .map(
                            c => `

                                <article class="card p-5">

                                    <span class="badge">
                                        ${SB.esc(c.collaboration_type || c.type)}
                                    </span>

                                    <h2 class="mt-3 text-xl font-black">
                                        ${SB.esc(c.title)}
                                    </h2>

                                    <p class="mt-2 text-sm text-slate-500">
                                        ${SB.esc(c.description || '')}
                                    </p>

                                    <button
                                        class="btn btn-primary mt-4"
                                        onclick="reg(${c.id})"
                                    >
                                        Register
                                    </button>

                                </article>

                            `
                        )
                        .join('') ||
                    '<p class="text-slate-500">No active collaborations.</p>';

            }

            catch (e) {

                list.innerHTML = `

                    <p class="text-rose-600">
                        ${SB.esc(e.message)}
                    </p>

                `;

            }

        })();


        window.reg = async id => {

            try {

                await SB.post(
                    `/students/collaborations/${id}/register`,
                    {}
                );


                SB.toast(
                    'Registered successfully'
                );

            }

            catch (e) {

                SB.toast(
                    e.message
                );

            }

        };

    </script>


    <script>

        if (window.lucide) {
            lucide.createIcons();
        }

    </script>

</body>

</html>
