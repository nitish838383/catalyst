<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/app.css">

    <title>Notifications | SkillBridge AI</title>
</head>

<body class="bg-slate-50 text-slate-900">

    <script>
        window.SKILLBRIDGE_ROLE = "student";
    </script>

    <div id="app-shell">

        <main class="min-h-screen lg:pl-72">

            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

                <header class="mb-7">

                    <p class="text-sm font-semibold text-indigo-600">
                        SkillBridge AI
                    </p>

                    <h1 class="mt-1 text-3xl font-bold tracking-tight">
                        Notifications
                    </h1>

                    <p class="mt-2 text-slate-500">
                        Application, interview and collaboration updates.
                    </p>

                </header>


                <div class="mb-4 flex justify-end">

                    <button
                        id="readAll"
                        class="btn btn-soft"
                    >
                        Mark all read
                    </button>

                </div>


                <div
                    id="list"
                    class="space-y-3"
                ></div>

            </div>

        </main>

    </div>


    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/shell.js"></script>


    <script>

        async function load() {

            try {

                const r =
                    await SB.get(
                        '/notifications'
                    );


                const a =
                    r.data ||
                    r ||
                    [];


                list.innerHTML =
                    a
                        .map(
                            n => `

                                <button
                                    onclick="markRead(${n.id})"
                                    class="card w-full p-4 text-left ${n.is_read ? 'opacity-60' : ''}"
                                >

                                    <div class="font-bold">
                                        ${SB.esc(n.title)}
                                    </div>

                                    <p class="mt-1 text-sm text-slate-500">
                                        ${SB.esc(n.message || '')}
                                    </p>

                                </button>

                            `
                        )
                        .join('') ||
                    '<p class="text-slate-500">No notifications.</p>';

            }

            catch (e) {

                list.innerHTML = `

                    <p class="text-rose-600">
                        ${SB.esc(e.message)}
                    </p>

                `;

            }

        }


        window.markRead = async id => {

            try {

                await SB.patch(
                    `/notifications/${id}/read`,
                    {}
                );


                load();

            }

            catch (e) {

                SB.toast(
                    e.message
                );

            }

        };


        readAll.onclick = async () => {

            try {

                await SB.patch(
                    '/notifications/read-all',
                    {}
                );


                load();

            }

            catch (e) {

                SB.toast(
                    e.message
                );

            }

        };


        load();

    </script>


    <script>

        if (window.lucide) {
            lucide.createIcons();
        }

    </script>

</body>

</html>
