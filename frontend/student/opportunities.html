<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Opportunities | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Opportunities</h1><p class="mt-2 text-slate-500">Discover jobs and internships with explainable skill matching.</p></header><div class="card p-5"><div class="flex flex-col gap-3 sm:flex-row"><input id="search" class="input" placeholder="Search opportunities"><select id="type" class="input sm:max-w-xs"><option value="">All types</option><option value="internship">Internship</option><option value="job">Job</option></select><button id="searchBtn" class="btn btn-primary">Search</button></div></div><div id="list" class="mt-5 grid gap-4 lg:grid-cols-2"></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function load(){list.innerHTML='<p>Loading…</p>';try{const q=new URLSearchParams();if(search.value)q.set('search',search.value);if(type.value)q.set('opportunity_type',type.value);const r=await SB.get('/opportunities?'+q.toString());const arr=r.data||r;list.innerHTML=arr.map(o=>`<article class="card p-6"><div class="flex items-start justify-between gap-4"><div><span class="badge">${SB.esc(o.type||o.opportunity_type||'Opportunity')}</span><h2 class="mt-3 text-xl font-black">${SB.esc(o.title)}</h2><p class="mt-2 text-sm text-slate-500">${SB.esc(o.location||'Remote / Flexible')}</p></div><div id="score-${o.id}" class="text-right text-sm font-bold text-indigo-600"></div></div><p class="mt-4 text-sm text-slate-600">${SB.esc(o.description||'')}</p><div id="gap-${o.id}" class="mt-4 text-sm"></div><div class="mt-5 flex gap-2"><button class="btn btn-soft" onclick="match(${o.id})">Check match</button><button class="btn btn-primary" onclick="apply(${o.id})">Apply</button></div></article>`).join('')||'<p class="text-slate-500">No opportunities found.</p>'}catch(e){list.innerHTML=`<p class="text-rose-600">${SB.esc(e.message)}</p>`}}window.match=async id=>{try{const r=await SB.get(`/students/opportunities/${id}/match`),m=r.match||r;document.getElementById('score-'+id).textContent=`${m.score||0}% match`;document.getElementById('gap-'+id).innerHTML=`<b>Matched:</b> ${(m.matched_skills||[]).map(SB.esc).join(', ')||'None'}<br><b>Missing:</b> ${(m.missing_skills||[]).map(SB.esc).join(', ')||'None'}`}catch(e){SB.toast(e.message)}};window.apply=async id=>{try{await SB.post(`/students/opportunities/${id}/apply`,{});SB.toast('Application submitted')}catch(e){SB.toast(e.message)}};searchBtn.onclick=load;load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
