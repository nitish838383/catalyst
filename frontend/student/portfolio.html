<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Projects & Certifications | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Projects & Certifications</h1><p class="mt-2 text-slate-500">Strengthen your profile with proof of work.</p></header><div class="grid gap-6 lg:grid-cols-2"><section class="card p-6"><h2 class="text-xl font-black">Projects</h2><form id="projectForm" class="mt-4 space-y-3"><input class="input" name="title" placeholder="Project title" required><textarea class="input" name="description" placeholder="Description"></textarea><input class="input" name="technologies" placeholder="Technologies, e.g. FastAPI, PostgreSQL"><input class="input" name="github_url" placeholder="GitHub URL"><button class="btn btn-primary">Add project</button></form><div id="projects" class="mt-5 space-y-3"></div></section><section class="card p-6"><h2 class="text-xl font-black">Certifications</h2><form id="certForm" class="mt-4 space-y-3"><input class="input" name="name" placeholder="Certificate name" required><input class="input" name="organization" placeholder="Organization / Issuer"><input class="input" name="credential_url" placeholder="Credential URL"><button class="btn btn-primary">Add certificate</button></form><div id="certs" class="mt-5 space-y-3"></div></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>async function loadPortfolio(){try{const p=await SB.get('/students/projects');projects.innerHTML=p.map(x=>`<div class="rounded-xl border p-4"><b>${SB.esc(x.title)}</b><p class="mt-1 text-sm text-slate-500">${SB.esc(x.description||'')}</p></div>`).join('')||'<p class="text-sm text-slate-500">No projects added.</p>'}catch(e){projects.innerHTML=`<p class="text-sm text-rose-600">${SB.esc(e.message)}</p>`}try{const c=await SB.get('/students/certifications');certs.innerHTML=c.map(x=>`<div class="rounded-xl border p-4"><b>${SB.esc(x.name)}</b><p class="text-sm text-slate-500">${SB.esc(x.organization||'')}</p></div>`).join('')||'<p class="text-sm text-slate-500">No certifications added.</p>'}catch(e){}}projectForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await SB.post('/students/projects',{title:f.get('title'),description:f.get('description')||null,technologies:f.get('technologies')||null,github_url:f.get('github_url')||null,live_url:null,start_date:null,end_date:null});e.target.reset();loadPortfolio()}catch(err){SB.toast(err.message)}};certForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await SB.post('/students/certifications',{name:f.get('name'),organization:f.get('organization')||null,issue_date:null,credential_url:f.get('credential_url')||null,credential_id:null});e.target.reset();loadPortfolio()}catch(err){SB.toast(err.message)}};loadPortfolio();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
