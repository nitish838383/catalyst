<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SkillBridge AI — Student Profile and Skills">

    <title>Profile & Skills | SkillBridge AI</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="/assets/css/app.css">
</head>

<body class="bg-slate-50 text-slate-900">

<script>
    window.SKILLBRIDGE_ROLE = "student";
</script>


<div id="app-shell">

    <main class="min-h-screen lg:pl-72">

        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

            <!-- ================= HEADER ================= -->

            <header class="mb-7">

                <p class="text-sm font-semibold text-indigo-600">
                    SkillBridge AI
                </p>

                <h1 class="mt-1 text-3xl font-bold tracking-tight">
                    Profile & Skills
                </h1>

                <p class="mt-2 text-slate-500">
                    Manage your academic profile and skills.
                </p>

            </header>


            <!-- ================= MAIN GRID ================= -->

            <div class="grid gap-6 lg:grid-cols-2">


                <!-- ================================================= -->
                <!-- STUDENT PROFILE -->
                <!-- ================================================= -->

                <section class="card p-6">

                    <div class="flex items-center gap-3">

                        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-100 text-indigo-600">

                            <i data-lucide="user"></i>

                        </div>

                        <div>

                            <h2 class="text-xl font-black">
                                Student Profile
                            </h2>

                            <p class="text-sm text-slate-500">
                                Academic and career information
                            </p>

                        </div>

                    </div>


                    <form id="profileForm"
                          class="mt-6 grid gap-4 sm:grid-cols-2">


                        <!-- Student Name -->

                        <div>

                            <label class="label">
                                Student Name
                            </label>

                            <input
                                id="studentName"
                                class="input bg-slate-100"
                                type="text"
                                readonly
                            >

                        </div>


                        <!-- Email -->

                        <div>

                            <label class="label">
                                Email
                            </label>

                            <input
                                id="studentEmail"
                                class="input bg-slate-100"
                                type="email"
                                readonly
                            >

                        </div>


                        <!-- College -->

                        <div>

                            <label class="label">
                                College
                            </label>

                            <select
                                id="collegeSelect"
                                class="input"
                                name="college_id"
                            >

                                <option value="">
                                    Select College
                                </option>

                            </select>

                        </div>


                        <!-- Department -->

                        <div>

                            <label class="label">
                                Department
                            </label>

                            <select
                                id="departmentSelect"
                                class="input"
                                name="department_id"
                                disabled
                            >

                                <option value="">
                                    Select Department
                                </option>

                            </select>

                        </div>


                        <!-- Branch -->

                        <div>

                            <label class="label">
                                Branch
                            </label>

                            <select
                                class="input"
                                name="branch"
                            >

                                <option value="">
                                    Select Branch
                                </option>

                                <option value="cse core">
                                    CSE Core
                                </option>

                                <option value="cse ai ml">
                                    CSE AI & ML
                                </option>

                                <option value="cse data science">
                                    CSE Data Science
                                </option>

                                <option value="information technology">
                                    Information Technology
                                </option>

                                <option value="ece">
                                    Electronics & Communication
                                </option>

                                <option value="eee">
                                    Electrical Engineering
                                </option>

                                <option value="mechanical">
                                    Mechanical Engineering
                                </option>

                                <option value="civil">
                                    Civil Engineering
                                </option>

                            </select>

                        </div>


                        <!-- Year -->

                        <div>

                            <label class="label">
                                Year
                            </label>

                            <select
                                class="input"
                                name="year"
                            >

                                <option value="">
                                    Select Year
                                </option>

                                <option value="1">
                                    1st Year
                                </option>

                                <option value="2">
                                    2nd Year
                                </option>

                                <option value="3">
                                    3rd Year
                                </option>

                                <option value="4">
                                    4th Year
                                </option>

                            </select>

                        </div>


                        <!-- Semester -->

                        <div>

                            <label class="label">
                                Semester
                            </label>

                            <select
                                class="input"
                                name="semester"
                            >

                                <option value="">
                                    Select Semester
                                </option>

                                <option value="1">
                                    Semester 1
                                </option>

                                <option value="2">
                                    Semester 2
                                </option>

                                <option value="3">
                                    Semester 3
                                </option>

                                <option value="4">
                                    Semester 4
                                </option>

                                <option value="5">
                                    Semester 5
                                </option>

                                <option value="6">
                                    Semester 6
                                </option>

                                <option value="7">
                                    Semester 7
                                </option>

                                <option value="8">
                                    Semester 8
                                </option>

                            </select>

                        </div>


                        <!-- CGPA -->

                        <div>

                            <label class="label">
                                CGPA
                            </label>

                            <input
                                class="input"
                                type="number"
                                name="cgpa"
                                min="0"
                                max="10"
                                step="0.01"
                                placeholder="e.g. 8.50"
                            >

                        </div>


                        <!-- Career Goal -->

                        <div class="sm:col-span-2">

                            <label class="label">
                                Career Interest
                            </label>

                            <select
                                class="input"
                                name="career_goal"
                            >

                                <option value="">
                                    Select Career Goal
                                </option>

                                <option value="backend developer">
                                    Backend Developer
                                </option>

                                <option value="frontend developer">
                                    Frontend Developer
                                </option>

                                <option value="full stack developer">
                                    Full Stack Developer
                                </option>

                                <option value="ai ml engineer">
                                    AI / ML Engineer
                                </option>

                                <option value="data analyst">
                                    Data Analyst
                                </option>

                                <option value="data scientist">
                                    Data Scientist
                                </option>

                            </select>

                        </div>


                        <!-- GitHub -->

                        <div>

                            <label class="label">
                                GitHub URL
                            </label>

                            <input
                                class="input"
                                name="github_url"
                                type="url"
                                placeholder="https://github.com/username"
                            >

                        </div>


                        <!-- LinkedIn -->

                        <div>

                            <label class="label">
                                LinkedIn URL
                            </label>

                            <input
                                class="input"
                                name="linkedin_url"
                                type="url"
                                placeholder="https://linkedin.com/in/username"
                            >

                        </div>


                        <!-- Save Button -->

                        <button
                            type="submit"
                            class="btn btn-primary sm:col-span-2"
                        >

                            Save Profile

                        </button>


                        <p
                            id="profileMsg"
                            class="text-sm sm:col-span-2"
                        ></p>


                    </form>

                </section>



                <!-- ================================================= -->
                <!-- SKILLS -->
                <!-- ================================================= -->

                <section class="card p-6">


                    <div class="flex items-center gap-3">

                        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 text-violet-600">

                            <i data-lucide="brain"></i>

                        </div>

                        <div>

                            <h2 class="text-xl font-black">
                                Skills
                            </h2>

                            <p class="text-sm text-slate-500">
                                Add your technical and professional skills
                            </p>

                        </div>

                    </div>


                    <!-- Add Skill Form -->

                    <form
                        id="skillForm"
                        class="mt-6 grid gap-3 sm:grid-cols-3"
                    >


                        <input
                            class="input sm:col-span-2"
                            name="name"
                            placeholder="e.g. FastAPI"
                            required
                        >


                        <select
                            class="input"
                            name="level"
                        >

                            <option value="beginner">
                                Beginner
                            </option>

                            <option value="intermediate">
                                Intermediate
                            </option>

                            <option value="advanced">
                                Advanced
                            </option>

                        </select>


                        <input
                            class="input sm:col-span-2"
                            name="category"
                            placeholder="Category (optional)"
                        >


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            Add Skill

                        </button>


                    </form>


                    <!-- Skills List -->

                    <div
                        id="skills"
                        class="mt-6 space-y-3"
                    >

                        <p class="text-sm text-slate-500">
                            Loading skills...
                        </p>

                    </div>


                </section>


            </div>

        </div>

    </main>

</div>



<!-- ================================================= -->
<!-- COMMON JS -->
<!-- ================================================= -->

<script src="/assets/js/config.js"></script>

<script src="/assets/js/api.js"></script>

<script src="/assets/js/auth.js"></script>

<script src="/assets/js/shell.js"></script>



<!-- ================================================= -->
<!-- PAGE LOGIC -->
<!-- ================================================= -->

<script>

let hasProfile = false;

let existingProfile = null;


/* =====================================================
   LOAD LOGGED IN USER
===================================================== */

async function loadUser() {

    try {

        const me = await Auth.me();

        document.getElementById("studentName").value =
            me.full_name || "";

        document.getElementById("studentEmail").value =
            me.email || "";

    }

    catch (error) {

        console.error(
            "Unable to load user:",
            error
        );

    }

}



/* =====================================================
   LOAD COLLEGES
===================================================== */

async function loadColleges() {

    const select =
        document.getElementById("collegeSelect");

    try {

        /*
            Expected backend response:

            {
                "success": true,
                "data": [
                    {
                        "id": 1,
                        "name": "MGM College"
                    }
                ]
            }
        */

        const response =
            await SB.get("/colleges");

        const colleges =
            response.data || response || [];


        select.innerHTML =
            '<option value="">Select College</option>';


        colleges.forEach(college => {

            const option =
                document.createElement("option");

            option.value =
                college.id;

            option.textContent =
                college.name ||
                college.college_name ||
                `College ${college.id}`;

            select.appendChild(option);

        });


        if (
            existingProfile &&
            existingProfile.college_id
        ) {

            select.value =
                existingProfile.college_id;

            await loadDepartments(
                existingProfile.college_id
            );

        }

    }

    catch (error) {

        console.warn(
            "College list API unavailable:",
            error.message
        );


        select.innerHTML = `
            <option value="">
                College list unavailable
            </option>
        `;

    }

}



/* =====================================================
   LOAD DEPARTMENTS
===================================================== */

async function loadDepartments(collegeId) {

    const select =
        document.getElementById("departmentSelect");


    select.innerHTML =
        '<option value="">Select Department</option>';


    if (!collegeId) {

        select.disabled = true;

        return;

    }


    select.disabled = true;


    try {

        /*
            Expected endpoint:

            /colleges/{college_id}/departments
        */

        const response =
            await SB.get(
                `/colleges/${collegeId}/departments`
            );


        const departments =
            response.data || response || [];


        departments.forEach(department => {

            const option =
                document.createElement("option");

            option.value =
                department.id;

            option.textContent =
                department.name ||
                department.department_name ||
                `Department ${department.id}`;

            select.appendChild(option);

        });


        select.disabled = false;


        if (
            existingProfile &&
            existingProfile.department_id
        ) {

            select.value =
                existingProfile.department_id;

        }

    }

    catch (error) {

        console.warn(
            "Department API unavailable:",
            error.message
        );


        select.innerHTML = `
            <option value="">
                Department list unavailable
            </option>
        `;

    }

}



/* =====================================================
   COLLEGE CHANGE
===================================================== */

document
    .getElementById("collegeSelect")
    .addEventListener(
        "change",
        async function () {

            existingProfile = null;

            await loadDepartments(
                this.value
            );

        }
    );



/* =====================================================
   LOAD STUDENT PROFILE
===================================================== */

async function loadProfile() {

    try {

        const profile =
            await SB.get(
                "/students/profile"
            );


        hasProfile = true;

        existingProfile = profile;


        for (
            const [key, value]
            of Object.entries(profile)
        ) {

            const element =
                profileForm.elements[key];


            if (
                element &&
                value !== null &&
                value !== undefined
            ) {

                element.value =
                    Array.isArray(value)
                        ? value.join(", ")
                        : value;

            }

        }

    }

    catch (error) {

        hasProfile = false;

        existingProfile = null;

        console.log(
            "Student profile not created yet."
        );

    }

}



/* =====================================================
   LOAD SKILLS
===================================================== */

async function loadSkills() {

    const container =
        document.getElementById("skills");


    if (!hasProfile) {

        container.innerHTML = `

            <div class="rounded-xl border border-amber-200 bg-amber-50 p-4">

                <p class="text-sm text-amber-700">

                    Create your profile before adding skills.

                </p>

            </div>

        `;

        return;

    }


    try {

        const response =
            await SB.get(
                "/students/skills"
            );


        const skillList =
            response.data || [];


        if (!skillList.length) {

            container.innerHTML = `

                <div class="rounded-xl border p-4">

                    <p class="text-sm text-slate-500">

                        No skills added yet.

                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            skillList
                .map(
                    skill => `

                    <div
                        class="flex items-center justify-between rounded-xl border border-slate-200 p-4"
                    >

                        <div>

                            <p class="font-bold text-slate-900">

                                ${SB.esc(skill.name)}

                            </p>


                            <p class="mt-1 text-xs text-slate-500">

                                ${SB.esc(skill.level)}

                                ·

                                ${
                                    skill.verified
                                        ? "Verified"
                                        : "Unverified"
                                }

                            </p>

                        </div>


                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="removeSkill(${skill.id})"
                        >

                            Remove

                        </button>


                    </div>

                `
                )
                .join("");

    }

    catch (error) {

        container.innerHTML = `

            <p class="text-sm text-rose-600">

                ${SB.esc(error.message)}

            </p>

        `;

    }

}



/* =====================================================
   SAVE PROFILE
===================================================== */

profileForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const formData =
            new FormData(this);


        const body = {};


        for (
            const [key, value]
            of formData.entries()
        ) {

            if (value === "") {

                body[key] = null;

                continue;

            }


            if (
                [
                    "college_id",
                    "department_id",
                    "year",
                    "semester"
                ].includes(key)
            ) {

                body[key] =
                    Number(value);

            }

            else if (
                key === "cgpa"
            ) {

                body[key] =
                    Number(value);

            }

            else {

                body[key] =
                    value;

            }

        }


        const message =
            document.getElementById(
                "profileMsg"
            );


        message.textContent =
            "Saving profile...";


        message.className =
            "text-sm text-slate-500 sm:col-span-2";


        try {

            if (hasProfile) {

                await SB.patch(
                    "/students/profile",
                    body
                );

            }

            else {

                await SB.post(
                    "/students/profile",
                    body
                );

            }


            hasProfile = true;


            message.textContent =
                "Profile saved successfully.";


            message.className =
                "text-sm text-emerald-600 sm:col-span-2";


            await loadProfile();

            await loadSkills();

        }

        catch (error) {

            message.textContent =
                error.message;


            message.className =
                "text-sm text-rose-600 sm:col-span-2";

        }

    }
);



/* =====================================================
   ADD SKILL
===================================================== */

skillForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (!hasProfile) {

            SB.toast(
                "Please create your profile first."
            );

            return;

        }


        const formData =
            new FormData(this);


        const payload = {

            name:
                formData.get("name"),

            level:
                formData.get("level"),

            category:
                formData.get("category")
                || null

        };


        try {

            await SB.post(
                "/students/skills",
                payload
            );


            this.reset();


            SB.toast(
                "Skill added successfully."
            );


            await loadSkills();

        }

        catch (error) {

            SB.toast(
                error.message
            );

        }

    }
);



/* =====================================================
   REMOVE SKILL
===================================================== */

window.removeSkill =
    async function (skillId) {

        try {

            await SB.del(
                `/students/skills/${skillId}`
            );


            SB.toast(
                "Skill removed."
            );


            await loadSkills();

        }

        catch (error) {

            SB.toast(
                error.message
            );

        }

    };



/* =====================================================
   INITIALIZE PAGE
===================================================== */

async function init() {

    await loadUser();

    await loadProfile();

    await loadColleges();

    await loadSkills();

}


init();

</script>



<!-- Lucide -->

<script>

    if (window.lucide) {

        lucide.createIcons();

    }

</script>


</body>

</html>
