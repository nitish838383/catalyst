<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Profile & Skills | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Profile & Skills</h1><p class="mt-2 text-slate-500">Create your academic profile and skill inventory.</p></header><div class="grid gap-6 lg:grid-cols-2"><section class="card p-6"><h2 class="text-xl font-black">Student profile</h2><form id="profileForm" class="mt-5 grid gap-4 sm:grid-cols-2"><div><label class="label">College ID</label><input class="input" type="number" name="college_id"></div><div><label class="label">Department ID</label><input class="input" type="number" name="department_id"></div><div><label class="label">Branch</label><input class="input" name="branch" placeholder="CSE AI & ML"></div><div><label class="label">Year</label><input class="input" type="number" name="year"></div><div><label class="label">Semester</label><input class="input" type="number" name="semester"></div><div><label class="label">CGPA</label><input class="input" type="number" step="0.01" name="cgpa"></div><div class="sm:col-span-2"><label class="label">Career interests</label><input class="input" name="career_goal" placeholder="Backend Developer / AI-ML Engineer"></div><div><label class="label">GitHub URL</label><input class="input" name="github_url"></div><div><label class="label">LinkedIn URL</label><input class="input" name="linkedin_url"></div><button class="btn btn-primary sm:col-span-2">Save profile</button><p id="profileMsg" class="text-sm sm:col-span-2"></p></form></section><section class="card p-6"><h2 class="text-xl font-black">Skills</h2><form id="skillForm" class="mt-5 grid gap-3 sm:grid-cols-3"><input class="input sm:col-span-2" name="name" placeholder="e.g. FastAPI" required><select class="input" name="level"><option>beginner</option><option>intermediate</option><option>advanced</option></select><input class="input sm:col-span-2" name="category" placeholder="Category (optional)"><button class="btn btn-primary">Add skill</button></form><div id="skills" class="mt-5 space-y-2"></div></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>let hasProfile=false;async function load(){try{const p=await SB.get('/students/profile');hasProfile=true;for(const [k,v] of Object.entries(p)){const el=profileForm.elements[k];if(el&&v!=null)el.value=Array.isArray(v)?v.join(', '):v}}catch(e){}if(!hasProfile){skills.innerHTML='<p class="text-sm text-amber-700">Create your profile before adding skills.</p>';return}try{const r=await SB.get('/students/skills');skills.innerHTML=(r.data||[]).map(s=>`<div class="flex items-center justify-between rounded-xl border p-3"><div><b>${SB.esc(s.name)}</b><div class="text-xs text-slate-500">${SB.esc(s.level)} · ${s.verified?'Verified':'Unverified'}</div></div><button class="btn btn-danger" onclick="removeSkill(${s.id})">Remove</button></div>`).join('')||'<p class="text-sm text-slate-500">No skills yet.</p>'}catch(e){skills.innerHTML=`<p class="text-sm text-rose-600">${SB.esc(e.message)}</p>`}}profileForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b={};for(const [k,v] of f)if(v!=='')b[k]=['college_id','department_id','year','semester'].includes(k)?Number(v):k==='cgpa'?Number(v):v;try{await (hasProfile?SB.patch('/students/profile',b):SB.post('/students/profile',b));hasProfile=true;profileMsg.className='text-sm text-emerald-600 sm:col-span-2';profileMsg.textContent='Profile saved.';load()}catch(err){profileMsg.className='text-sm text-rose-600 sm:col-span-2';profileMsg.textContent=err.message}};skillForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await SB.post('/students/skills',{name:f.get('name'),level:f.get('level'),category:f.get('category')||null});e.target.reset();load()}catch(err){SB.toast(err.message)}};window.removeSkill=async id=>{try{await SB.del('/students/skills/'+id);load()}catch(e){SB.toast(e.message)}};load();</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
