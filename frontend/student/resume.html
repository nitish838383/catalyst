<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillBridge AI — Academia–Industry Skill Intelligence Platform"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/css/app.css"><title>Resume AI | SkillBridge AI</title></head><body class="bg-slate-50 text-slate-900"><script>window.SKILLBRIDGE_ROLE="student";</script><div id="app-shell"><main class="min-h-screen lg:pl-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><header class="mb-7"><p class="text-sm font-semibold text-indigo-600">SkillBridge AI</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Resume AI</h1><p class="mt-2 text-slate-500">Upload a PDF, extract skills and add them to your profile.</p></header><div class="grid gap-6 lg:grid-cols-2"><section class="card p-6"><h2 class="text-xl font-black">Upload resume</h2><p class="mt-2 text-sm text-slate-500">PDF only, maximum size follows backend configuration.</p><form id="resumeForm" class="mt-5 space-y-4"><input class="input" type="file" name="file" accept="application/pdf" required><button class="btn btn-primary">Upload & Analyze</button></form><div id="resumeInfo" class="mt-5 text-sm"></div></section><section class="card p-6"><h2 class="text-xl font-black">Detected skills</h2><div id="detected" class="mt-5 space-y-2"><p class="text-sm text-slate-500">Upload a resume to start analysis.</p></div><button id="acceptBtn" class="btn btn-primary mt-5 hidden">Accept selected skills</button></section></div></div></main></div><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/shell.js"></script><script>let rid=null;let detectedSkills=[];resumeForm.onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const up=await SB.request('/resumes/upload',{method:'POST',body:fd});rid=up.id||up.resume_id;resumeInfo.textContent=`Resume #${rid} uploaded. Running analysis…`;await SB.post(`/resumes/${rid}/analyze`,{});const a=await SB.get(`/resumes/${rid}/analysis`);detectedSkills=a.data||[];detected.innerHTML=detectedSkills.map((s,i)=>`<label class="flex items-center gap-3 rounded-xl border p-3"><input type="checkbox" class="skillCheck" value="${s.resume_skill_id||s.id}" checked><div><b>${SB.esc(s.skill_name||s.name)}</b><div class="text-xs text-slate-500">Confidence: ${Math.round((s.confidence_score||s.confidence||0)*100)}%</div></div></label>`).join('')||'<p class="text-slate-500">No skills detected.</p>';if(detectedSkills.length)acceptBtn.classList.remove('hidden')}catch(err){resumeInfo.innerHTML=`<span class="text-rose-600">${SB.esc(err.message)}</span>`}};acceptBtn.onclick=async()=>{const ids=[...document.querySelectorAll('.skillCheck:checked')].map(x=>Number(x.value));try{await SB.request(`/resumes/${rid}/accept-skills`,{method:'POST',body:JSON.stringify(ids),headers:{'Content-Type':'application/json'}});SB.toast('Skills added to your profile')}catch(e){SB.toast(e.message)}};</script><script>if(window.lucide) lucide.createIcons();</script></body></html>
